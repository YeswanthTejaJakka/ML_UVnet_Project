exp_name: e4_combined
description: "UltraLight VM-UNet with Scale-Aware Boundary + Corruption Consistency"

# Data
data_root: "/content/tn3k"
img_size: [256, 256]
fold: 0

# Optimization
batch_size: 16
epochs: 150
lr: 0.001
weight_decay: 0.01
scheduler: "cosine"
min_lr: 0.00001

# Loss configurations
use_boundary_loss: true
lambda_boundary: 1.0
boundary_alpha: 1.0
boundary_gamma: 0.5
boundary_min_weight: 1.0
boundary_max_weight: 5.0

use_consistency_loss: true
lambda_consistency: 1.0
speckle_sigma: 0.15
contrast_factor: 0.75

# Model
aux_boundary_head: true
