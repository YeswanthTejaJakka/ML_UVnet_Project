# E4 Combined — combined boundary + consistency losses
_base_: "base.yaml"

exp_name: "e4_combined"
description: "UltraLight VM-UNet with combined boundary + consistency losses (E4)."

# Loss: seg + boundary + consistency
use_boundary_loss: true
boundary_mode: "from_mask"
lambda_boundary: 0.3
boundary_warmup_frac: 0.20
boundary_a_ref: 0.05
boundary_gamma: 0.5
boundary_w_max: 4.0
scale_aware_seg: false

use_consistency_loss: true
lambda_consistency: 1.0
consistency_warmup_frac: 0.20

speckle_sigma_min: 0.05
speckle_sigma_max: 0.30
contrast_min: 0.5
contrast_max: 1.0
blur_sigma_max: 1.0

aux_boundary_head: false
