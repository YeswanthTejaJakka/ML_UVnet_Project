# E3 Consistency — corruption-aware consistency training
_base_: "base.yaml"

exp_name: "e3_consistency"
description: "UltraLight VM-UNet with corruption-aware consistency loss (E3)."

# Loss: seg + consistency
use_boundary_loss: false
use_consistency_loss: true
lambda_consistency: 1.0      # default tuned in Stage B from {0.5, 1, 2}
consistency_warmup_frac: 0.20

# Per-sample random corruption parameters
speckle_sigma_min: 0.05
speckle_sigma_max: 0.30
contrast_min: 0.5
contrast_max: 1.0
blur_sigma_max: 1.0

aux_boundary_head: false
