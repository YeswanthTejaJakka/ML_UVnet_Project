exp_name: e3_consistency
description: "UltraLight VM-UNet with Ultrasound Corruption Consistency Training"

# Data
data_root: "/content/tn3k"
img_size: [256, 256]
fold: 0

# Optimization
batch_size: 16
epochs: 150
lr: 0.001
weight_decay: 0.01
scheduler: "cosine"
min_lr: 0.00001

# Loss configurations
use_boundary_loss: false
use_consistency_loss: true
lambda_consistency: 1.0
speckle_sigma: 0.15
contrast_factor: 0.75

# Model
aux_boundary_head: false
