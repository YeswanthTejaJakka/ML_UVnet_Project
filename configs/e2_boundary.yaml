# E2 Boundary — lesion-scale-aware boundary supervision
_base_: "base.yaml"

exp_name: "e2_boundary"
description: "UltraLight VM-UNet with lesion-scale-aware boundary supervision (E2)."

# Loss: seg + scale-aware boundary
use_boundary_loss: true
boundary_mode: "from_mask"   # differentiable morphological gradient on main mask prob
lambda_boundary: 0.3         # default tuned in Stage B from {0.1, 0.3, 0.5}
boundary_warmup_frac: 0.20   # linear warm-up from 0 over first 20% of epochs
boundary_a_ref: 0.05
boundary_gamma: 0.5
boundary_w_max: 4.0
scale_aware_seg: false

use_consistency_loss: false
aux_boundary_head: false
